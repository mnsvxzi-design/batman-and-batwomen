<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #fff0f3;
            font-family: 'Arial', sans-serif;
            text-align: center;
        }
        h1 { color: #ff4d6d; font-size: 2.5rem; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .buttons { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        #yesBtn {
            background-color: #43aa8b;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
        }
        #noBtn {
            background-color: #e63946;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
        }
        #message { display: none; font-size: 1.5rem; color: #ff4d6d; font-weight: bold; margin-top: 20px; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="container" id="main-content">
        <h1 id="question">Will you be my Valentine? ❤️</h1>
        <div class="buttons" id="btn-group">
            <button id="yesBtn" onclick="sayYes()">Yes</button>
            <button id="noBtn" onclick="growYes()">No</button>
        </div>
        <div id="message"></div>
    </div>

    <script>
        let clickCount = 0;
        let yesSize = 1.2;
        
        function growYes() {
            clickCount++;
            yesSize += 0.5; // Makes it bigger each time
            document.getElementById('yesBtn').style.transform = `scale(${yesSize})`;
            
            if (clickCount >= 5) {
                document.getElementById('noBtn').style.display = 'none'; // No more escaping!
            }
        }

        function sayYes() {
            const messageDiv = document.getElementById('message');
            const btnGroup = document.getElementById('btn-group');
            const question = document.getElementById('question');

            btnGroup.style.display = 'none';
            question.style.display = 'none';
            messageDiv.style.display = 'block';

            if (clickCount === 0) {
                messageDiv.innerHTML = "I love you! ❤️ <br><br> <small>(But try pressing 'No' next time to see what happens... 😉)</small>";
            } else {
                messageDiv.innerHTML = "I love you so much Catwoman! 🐾❤️ <br><br> I can't wait to spend the rest of my life loving you.";
            }
        }
    </script>
</body>
</html>
