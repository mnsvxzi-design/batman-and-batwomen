<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            background-color: #121212; /* Dark background like the monitor */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Times New Roman', serif;
            color: #ffdc5e; /* Classic gold/yellow text */
        }

        .outer-frame {
            border: 6px solid #ffdc5e;
            border-radius: 60px 20px 60px 20px; /* Custom shape from your image */
            padding: 40px;
            text-align: center;
            box-shadow: 0 0 30px #ffdc5e; /* The glow effect */
            max-width: 500px;
            background: rgba(30, 30, 30, 0.8);
            position: relative;
        }

        .icons {
            font-size: 24px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #ffdc5e;
        }

        .couple-img {
            width: 100%;
            max-width: 350px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        #noBtn {
            background-color: #333333;
            color: #ffffff;
        }

        #yesBtn {
            background-color: #ffdc5e;
            color: #000000;
        }

        .footer-text {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #ffdc5e;
            margin-top: 20px;
        }

        #finalMessage {
            display: none;
            font-size: 1.5rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="outer-frame">
        <div class="icons">🦇 💛 🐾</div>
        
        <h1 id="question">Will you be my Valentine? ❤️</h1>

        <img src="couple.png" alt="Batman and Catwoman" class="couple-img">

        <div class="button-container" id="btnGroup">
            <button id="noBtn" onmouseover="moveNo()">No</button>
            <button id="yesBtn" onclick="showLove()">Yes</button>
        </div>

        <div class="footer-text">
            I love you so much Catwoman! 🐾 💛<br>
            I can't wait to spend the rest of life loving you.
        </div>

        <div id="finalMessage">Yay! I love you forever! 🦇💍🐾</div>
    </div>

    <script>
        function moveNo() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            btn.style.position = 'absolute';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }

        function showLove() {
            document.getElementById('btnGroup').style.display = 'none';
            document.getElementById('question').style.display = 'none';
            document.getElementById('finalMessage').style.display = 'block';
        }
    </script>

</body>
</html>
