<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Catwoman 🐾</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a; /* Batman Dark Gray */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            color: white;
            overflow-x: hidden;
        }
        .container { 
            background: #2b2b2b; 
            padding: 30px; 
            border: 4px solid #ffcc00; /* Batman Yellow */
            border-radius: 30px; 
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.3); 
            max-width: 400px;
            width: 90%;
            margin: 20px;
        }
        img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px solid #ffcc00;
        }
        h1 { color: #ffcc00; font-size: 2rem; text-shadow: 2px 2px #000; margin-bottom: 20px; }
        .buttons { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; }
        #yesBtn {
            background-color: #ffcc00;
            color: black;
            font-weight: bold;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            z-index: 100;
        }
        #noBtn {
            background-color: #444;
            color: white;
            border: 2px solid #666;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
        }
        #message { display: none; font-size: 1.5rem; color: #ffcc00; font-weight: bold; line-height: 1.4; padding: 10px; }
        .bat-icon { font-size: 2.5rem; margin-bottom: 10px; }
    </style>
</head>
