<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Catwoman 🐾</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a; 
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            color: white;
        }
        .container { 
            background: rgba(43, 43, 43, 0.9); 
            padding: 30px; 
            border: 4px solid #ffcc00; 
            border-radius: 30px; 
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.4); 
            max-width: 450px;
            width: 90%;
        }
        .hero-img {
            width: 100%;
            border-radius: 15px;
            border: 2px solid #ffcc00;
            margin-bottom: 20px;
        }
        h1 { color: #ffcc00; font-size: 2rem; margin-bottom: 20px; text-shadow: 2px 2px #000; }
        #yesBtn {
            background-color: #ffcc00;
            color: black;
            font-weight: bold;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        #noBtn {
            background-color: #444;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.2rem;
            cursor: pointer;
        }
        #message { 
            display: none; 
            font-size: 1.6rem; 
            color: #ffcc00; 
            font-weight: bold; 
            line-height: 1.5;
            animation: fadeIn 1s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="container">
        <div style="font-size: 2rem; margin-bottom: 10px;">🦇 💛 🐾</div>
        
        <img src="couple.png" class="hero-img" alt="Catwoman and Batwoman">

        <h1 id="question">Will you be my Valentine?</h1>
        
        <div class="buttons" id="btn-group" style="display: flex; justify-content: center; gap: 20px;">
            <button id="yesBtn" onclick="sayYes()">Yes</button>
            <button id="noBtn" onclick="growYes()">No</button>
        </div>

        <div id="message">
            I love you so much Catwoman! 🐾💛<br>
            I can't wait to spend the rest of my life loving you.
        </div>
    </div>

    <script>
        let clickCount = 0;
        let yesSize = 1;
        
        function growYes() {
            clickCount++;
            yesSize += 0.6; 
            document.getElementById('yesBtn').style.transform = `scale(${yesSize})`;
            if (clickCount >= 5) {
                document.getElementById('noBtn').style.display = 'none';
            }
        }

        function sayYes() {
            document.getElementById('btn-group').style.display = 'none';
            document.getElementById('question').style.display = 'none';
            document.getElementById('message').style.display = 'block';
        }
    </script>
</body>
</html>
